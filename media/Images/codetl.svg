<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0d1e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.9" fill="rgba(0,212,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="800" height="360" fill="url(#bg)"/>
  <rect width="800" height="360" fill="url(#dots)"/>

  <!-- Background code hint -->
  <text x="40" y="310" fill="rgba(0,212,255,0.04)" font-family="monospace" font-size="60" font-weight="700">ETL</text>

  <!-- Stage labels -->
  <text x="144" y="44" text-anchor="middle" fill="rgba(0,212,255,0.4)" font-family="monospace" font-size="9" letter-spacing="1">EXTRACT</text>
  <text x="400" y="44" text-anchor="middle" fill="rgba(124,58,237,0.5)" font-family="monospace" font-size="9" letter-spacing="1">TRANSFORM</text>
  <text x="656" y="44" text-anchor="middle" fill="rgba(0,212,255,0.4)" font-family="monospace" font-size="9" letter-spacing="1">LOAD</text>

  <!-- Extract box -->
  <rect x="44" y="58" width="200" height="200" rx="12" fill="rgba(0,212,255,0.05)" stroke="rgba(0,212,255,0.2)" stroke-width="1.5"/>
  <!-- Source icons -->
  <text x="64" y="85" fill="rgba(0,212,255,0.6)" font-family="monospace" font-size="9" font-weight="600">SOURCE SYSTEMS</text>
  <rect x="64" y="98" width="160" height="28" rx="6" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
  <text x="74" y="116" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="9">Oracle DB  ·  XML Feed</text>
  <rect x="64" y="134" width="160" height="28" rx="6" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
  <text x="74" y="152" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="9">PostgreSQL  ·  S3 Files</text>
  <rect x="64" y="170" width="160" height="28" rx="6" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
  <text x="74" y="188" fill="rgba(255,255,255,0.5)" font-family="monospace" font-size="9">API Streams  ·  CSV</text>
  <!-- Row count -->
  <text x="144" y="230" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="22" font-weight="700">15M</text>
  <text x="144" y="246" text-anchor="middle" fill="rgba(0,212,255,0.4)" font-family="monospace" font-size="9">records/batch</text>

  <!-- Arrow -->
  <line x1="246" y1="158" x2="292" y2="158" stroke="rgba(0,212,255,0.4)" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="292,152 306,158 292,164" fill="rgba(0,212,255,0.5)"/>

  <!-- Transform box -->
  <rect x="308" y="58" width="184" height="200" rx="12" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.35)" stroke-width="2"/>
  <text x="400" y="82" text-anchor="middle" fill="rgba(167,139,250,0.6)" font-family="monospace" font-size="9" font-weight="600">RULE ENGINE</text>
  <!-- Code snippet -->
  <rect x="322" y="92" width="156" height="130" rx="6" fill="rgba(0,0,0,0.3)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="334" y="110" fill="rgba(124,58,237,0.5)" font-family="monospace" font-size="8">def transform(row):</text>
  <text x="342" y="125" fill="rgba(167,139,250,0.6)" font-family="monospace" font-size="8">if validate(row):</text>
  <text x="350" y="140" fill="rgba(0,212,255,0.6)" font-family="monospace" font-size="8">clean(row)</text>
  <text x="350" y="155" fill="rgba(0,212,255,0.6)" font-family="monospace" font-size="8">map_schema(row)</text>
  <text x="350" y="170" fill="rgba(0,212,255,0.6)" font-family="monospace" font-size="8">audit_log(row)</text>
  <text x="342" y="185" fill="rgba(124,58,237,0.4)" font-family="monospace" font-size="8">return row</text>
  <text x="334" y="200" fill="rgba(124,58,237,0.3)" font-family="monospace" font-size="8">  # auto-generated</text>
  <!-- 40% label -->
  <text x="400" y="228" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="16" font-weight="700">-40%</text>
  <text x="400" y="244" text-anchor="middle" fill="rgba(167,139,250,0.4)" font-family="monospace" font-size="8">dev effort</text>

  <!-- Arrow -->
  <line x1="494" y1="158" x2="538" y2="158" stroke="rgba(0,212,255,0.4)" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="538,152 552,158 538,164" fill="rgba(0,212,255,0.5)"/>

  <!-- Load box -->
  <rect x="556" y="58" width="200" height="200" rx="12" fill="rgba(0,212,255,0.05)" stroke="rgba(0,212,255,0.2)" stroke-width="1.5"/>
  <text x="656" y="82" text-anchor="middle" fill="rgba(0,212,255,0.6)" font-family="monospace" font-size="9" font-weight="600">DATA WAREHOUSE</text>
  <!-- Layer stack -->
  <rect x="576" y="96" width="160" height="24" rx="5" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <text x="656" y="112" text-anchor="middle" fill="rgba(0,212,255,0.7)" font-family="monospace" font-size="9">Landing Layer</text>
  <line x1="656" y1="120" x2="656" y2="136" stroke="rgba(0,212,255,0.2)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="576" y="136" width="160" height="24" rx="5" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.18)" stroke-width="1"/>
  <text x="656" y="152" text-anchor="middle" fill="rgba(0,212,255,0.6)" font-family="monospace" font-size="9">Staging Layer</text>
  <line x1="656" y1="160" x2="656" y2="176" stroke="rgba(0,212,255,0.2)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="576" y="176" width="160" height="24" rx="5" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>
  <text x="656" y="192" text-anchor="middle" fill="rgba(0,212,255,0.5)" font-family="monospace" font-size="9">Master / ODS</text>
  <!-- SLA label -->
  <text x="656" y="226" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="13" font-weight="700">SLA MET</text>
  <text x="656" y="244" text-anchor="middle" fill="rgba(0,212,255,0.4)" font-family="monospace" font-size="8">nightly batch · audit tracked</text>

  <!-- Airflow orchestration bar -->
  <rect x="44" y="276" width="712" height="40" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <text x="76" y="300" fill="rgba(167,139,250,0.5)" font-family="monospace" font-size="9" font-weight="600">AIRFLOW ORCHESTRATION</text>
  <!-- DAG nodes -->
  <circle cx="280" cy="296" r="6" fill="rgba(124,58,237,0.3)" stroke="rgba(124,58,237,0.5)" stroke-width="1"/>
  <line x1="286" y1="296" x2="330" y2="296" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <circle cx="336" cy="296" r="6" fill="rgba(124,58,237,0.3)" stroke="rgba(124,58,237,0.5)" stroke-width="1"/>
  <line x1="342" y1="296" x2="386" y2="296" stroke="rgba(124,58,237,0.2)" stroke-width="1"/>
  <circle cx="392" cy="296" r="6" fill="rgba(0,212,255,0.3)" stroke="rgba(0,212,255,0.5)" stroke-width="1"/>
  <line x1="398" y1="296" x2="442" y2="296" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <circle cx="448" cy="296" r="6" fill="rgba(0,212,255,0.3)" stroke="rgba(0,212,255,0.5)" stroke-width="1"/>
  <line x1="454" y1="296" x2="498" y2="296" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
  <circle cx="504" cy="296" r="6" fill="rgba(34,197,94,0.3)" stroke="rgba(34,197,94,0.5)" stroke-width="1"/>
  <text x="680" y="300" fill="rgba(34,197,94,0.5)" font-family="monospace" font-size="8">25+ TRANSFORMATIONS</text>

  <text x="400" y="345" text-anchor="middle" fill="rgba(0,212,255,0.25)" font-family="monospace" font-size="10" letter-spacing="2">PYSPARK · AWS GLUE · AIRFLOW · AUTO CODE GENERATION</text>
</svg>
