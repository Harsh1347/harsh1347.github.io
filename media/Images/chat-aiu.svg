<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f0f20"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.9" fill="rgba(0,212,255,0.07)"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="360" fill="url(#bg)"/>
  <rect width="800" height="360" fill="url(#dots)"/>

  <!-- Radial glow behind center -->
  <circle cx="400" cy="180" r="100" fill="rgba(0,212,255,0.05)"/>

  <!-- Connection lines to departments -->
  <line x1="400" y1="180" x2="180" y2="80"  stroke="rgba(0,212,255,0.25)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="400" y1="180" x2="180" y2="180" stroke="rgba(0,212,255,0.25)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="400" y1="180" x2="180" y2="280" stroke="rgba(0,212,255,0.25)" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="400" y1="180" x2="620" y2="80"  stroke="rgba(124,58,237,0.3)"  stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="400" y1="180" x2="620" y2="180" stroke="rgba(124,58,237,0.3)"  stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="400" y1="180" x2="620" y2="280" stroke="rgba(124,58,237,0.3)"  stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Central hub -->
  <circle cx="400" cy="180" r="58" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.5)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="400" cy="180" r="42" fill="rgba(0,212,255,0.12)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
  <!-- Chat bubble icon -->
  <path d="M382 165 Q382 158 389 158 L411 158 Q418 158 418 165 L418 177 Q418 184 411 184 L396 184 L390 192 L390 184 Q382 184 382 177 Z" fill="#00d4ff" opacity="0.9"/>
  <line x1="390" y1="167" x2="410" y2="167" stroke="#0a0a0f" stroke-width="2" stroke-linecap="round"/>
  <line x1="390" y1="172" x2="407" y2="172" stroke="#0a0a0f" stroke-width="2" stroke-linecap="round"/>
  <line x1="390" y1="177" x2="403" y2="177" stroke="#0a0a0f" stroke-width="2" stroke-linecap="round"/>
  <text x="400" y="206" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">RAG ENGINE</text>

