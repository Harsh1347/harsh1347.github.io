  <text x="620" y="89" text-anchor="middle" fill="rgba(167,139,250,0.5)" font-family="monospace" font-size="9">Department</text>
  <circle cx="560" cy="80" r="4" fill="#7c3aed" opacity="0.8"/>

  <rect x="560" y="152" width="120" height="56" rx="10" fill="rgba(124,58,237,0.07)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5"/>
  <text x="620" y="174" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="600">Library</text>
  <text x="620" y="189" text-anchor="middle" fill="rgba(167,139,250,0.5)" font-family="monospace" font-size="9">Department</text>
  <circle cx="560" cy="180" r="4" fill="#7c3aed" opacity="0.8"/>

  <rect x="560" y="252" width="120" height="56" rx="10" fill="rgba(124,58,237,0.07)" stroke="rgba(124,58,237,0.35)" stroke-width="1.5"/>
  <text x="620" y="274" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="600">IT Support</text>
  <text x="620" y="289" text-anchor="middle" fill="rgba(167,139,250,0.5)" font-family="monospace" font-size="9">Department</text>
  <circle cx="560" cy="280" r="4" fill="#7c3aed" opacity="0.8"/>

