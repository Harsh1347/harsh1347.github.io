  <text x="400" y="338" text-anchor="middle" fill="rgba(0,212,255,0.35)" font-family="monospace" font-size="10" letter-spacing="2">MULTI-TENANT · 10+ DEPLOYMENTS · AZURE AI SEARCH</text>
