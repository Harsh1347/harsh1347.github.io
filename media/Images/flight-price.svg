<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e0e1a"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.9" fill="rgba(0,212,255,0.06)"/>
    </pattern>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#00d4ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="360" fill="url(#bg)"/>
  <rect width="800" height="360" fill="url(#dots)"/>

  <!-- Chart area -->
  <rect x="80" y="60" width="640" height="220" rx="10" fill="rgba(255,255,255,0.01)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Grid lines -->
  <line x1="80" y1="115" x2="720" y2="115" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="80" y1="170" x2="720" y2="170" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="80" y1="225" x2="720" y2="225" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Price labels -->
  <text x="66" y="118" text-anchor="end" fill="rgba(255,255,255,0.25)" font-family="monospace" font-size="9">$800</text>
  <text x="66" y="173" text-anchor="end" fill="rgba(255,255,255,0.25)" font-family="monospace" font-size="9">$500</text>
  <text x="66" y="228" text-anchor="end" fill="rgba(255,255,255,0.25)" font-family="monospace" font-size="9">$200</text>
  <text x="66" y="276" text-anchor="end" fill="rgba(255,255,255,0.25)" font-family="monospace" font-size="9">$0</text>

  <!-- Date labels -->
  <text x="120"  y="298" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="monospace" font-size="8">Jan</text>
  <text x="210"  y="298" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="monospace" font-size="8">Feb</text>
  <text x="300"  y="298" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="monospace" font-size="8">Mar</text>
  <text x="390"  y="298" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="monospace" font-size="8">Apr</text>
  <text x="480"  y="298" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="monospace" font-size="8">May</text>
  <text x="570"  y="298" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="monospace" font-size="8">Jun</text>
  <text x="660"  y="298" text-anchor="middle" fill="rgba(255,255,255,0.2)" font-family="monospace" font-size="8">Jul</text>

  <!-- Area fill under price line -->
  <path d="M120,210 C150,200 170,130 210,145 C250,160 260,190 300,175 C340,160 360,110 390,120 C430,132 450,155 480,140 C520,122 540,90 570,105 C600,120 630,145 660,130 L660,280 L120,280 Z"
    fill="url(#areaGrad)"/>

  <!-- Actual price line -->
  <path d="M120,210 C150,200 170,130 210,145 C250,160 260,190 300,175 C340,160 360,110 390,120 C430,132 450,155 480,140 C520,122 540,90 570,105 C600,120 630,145 660,130"
    fill="none" stroke="url(#lineGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Prediction dashed line continuation -->
  <path d="M660,130 C680,118 700,108 720,100"
    fill="none" stroke="rgba(124,58,237,0.7)" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>

  <!-- Data points -->
  <circle cx="120" cy="210" r="4" fill="rgba(0,212,255,0.3)" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="210" cy="145" r="4" fill="rgba(0,212,255,0.3)" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="300" cy="175" r="4" fill="rgba(0,212,255,0.3)" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="390" cy="120" r="4" fill="rgba(0,212,255,0.3)" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="480" cy="140" r="4" fill="rgba(0,212,255,0.3)" stroke="#00d4ff" stroke-width="1.5"/>
  <circle cx="570" cy="105" r="5" fill="#00d4ff" stroke="rgba(0,212,255,0.4)" stroke-width="2"/>
  <circle cx="660" cy="130" r="4" fill="rgba(0,212,255,0.3)" stroke="#00d4ff" stroke-width="1.5"/>

  <!-- Prediction point with label -->
  <circle cx="720" cy="100" r="6" fill="rgba(124,58,237,0.2)" stroke="#7c3aed" stroke-width="2"/>
  <rect x="628" y="66" width="88" height="30" rx="5" fill="rgba(124,58,237,0.12)" stroke="rgba(124,58,237,0.3)" stroke-width="1"/>
  <text x="672" y="80" text-anchor="middle" fill="rgba(167,139,250,0.6)" font-family="monospace" font-size="8">PREDICTED</text>
  <text x="672" y="92" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="9" font-weight="600">$342</text>

  <!-- Best buy callout -->
  <line x1="570" y1="105" x2="570" y2="78" stroke="rgba(0,212,255,0.3)" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="508" y="60" width="80" height="26" rx="5" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
  <text x="548" y="71" text-anchor="middle" fill="rgba(0,212,255,0.5)" font-family="monospace" font-size="7">BEST BUY</text>
  <text x="548" y="82" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="8" font-weight="600">$189</text>

  <!-- Airplane icon -->
  <g transform="translate(370, 310) rotate(-5)">
    <path d="M0,0 L18,-5 L22,0 L18,5 Z M6,-3 L6,3 L-6,2 L-6,-2 Z M16,-2 L16,2 L10,3 L10,-3 Z" fill="#00d4ff" opacity="0.5"/>
  </g>

  <!-- Legend -->
  <line x1="96" y1="332" x2="118" y2="332" stroke="rgba(0,212,255,0.6)" stroke-width="2"/>
  <text x="124" y="336" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="9">Actual Price</text>
  <line x1="220" y1="332" x2="242" y2="332" stroke="rgba(124,58,237,0.6)" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="248" y="336" fill="rgba(255,255,255,0.35)" font-family="monospace" font-size="9">ML Prediction</text>

  <text x="560" y="336" fill="rgba(0,212,255,0.3)" font-family="monospace" font-size="9" letter-spacing="1">XGBoost · Ensemble · Feature Eng.</text>
</svg>
