<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0d1e"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.9" fill="rgba(0,212,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="800" height="360" fill="url(#bg)"/>
  <rect width="800" height="360" fill="url(#dots)"/>

  <!-- Background big number -->
  <text x="400" y="260" text-anchor="middle" fill="rgba(0,212,255,0.03)" font-family="monospace" font-size="140" font-weight="700">BOT</text>

  <!-- Discord-style server panel (left) -->
  <rect x="44" y="60" width="64" height="240" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <!-- Server icon -->
  <rect x="56" y="76" width="40" height="40" rx="20" fill="rgba(88,101,242,0.25)" stroke="rgba(88,101,242,0.5)" stroke-width="1.5"/>
  <text x="76" y="102" text-anchor="middle" fill="rgba(88,101,242,0.9)" font-size="18">⚡</text>
  <line x1="76" y1="116" x2="76" y2="128" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Channel icons -->
  <rect x="56" y="130" width="40" height="40" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="76" y="156" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="16">#</text>
  <rect x="56" y="178" width="40" height="40" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="76" y="204" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="14">🔔</text>
  <rect x="56" y="226" width="40" height="40" rx="20" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="76" y="252" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-size="14">⚙</text>

  <!-- Main Discord chat area -->
  <rect x="120" y="60" width="536" height="240" rx="12" fill="rgba(0,0,0,0.35)" stroke="rgba(88,101,242,0.2)" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="120" y="60" width="536" height="44" rx="12" fill="rgba(88,101,242,0.08)"/>
  <rect x="120" y="88" width="536" height="16" fill="rgba(88,101,242,0.08)"/>
  <text x="150" y="87" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="12" font-weight="600"># sneaker-alerts</text>
  <circle cx="620" cy="82" r="4" fill="#22c55e"/>
  <text x="632" y="86" fill="rgba(255,255,255,0.25)" font-family="monospace" font-size="9">LIVE</text>

  <!-- Alert message 1 -->
  <rect x="138" y="118" width="500" height="56" rx="8" fill="rgba(88,101,242,0.07)" stroke="rgba(88,101,242,0.15)" stroke-width="1"/>
  <rect x="138" y="118" width="4" height="56" rx="2" fill="#5865f2"/>
  <text x="154" y="135" fill="rgba(88,101,242,0.8)" font-family="monospace" font-size="9" font-weight="600">SneakerBot</text>
  <text x="220" y="135" fill="rgba(255,255,255,0.2)" font-family="monospace" font-size="8">Today at 9:04 AM</text>
  <text x="154" y="152" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="9">RESTOCK ALERT: Nike Air Jordan 1 Retro High OG</text>
  <text x="154" y="165" fill="rgba(0,212,255,0.7)" font-family="monospace" font-size="9">Size 10.5 · $180 · stockx.com · AVAILABLE NOW</text>

  <!-- Alert message 2 (highlighted / new) -->
  <rect x="138" y="184" width="500" height="56" rx="8" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.3)" stroke-width="1.5"/>
  <rect x="138" y="184" width="4" height="56" rx="2" fill="#00d4ff"/>
  <text x="154" y="201" fill="#00d4ff" font-family="monospace" font-size="9" font-weight="600">SneakerBot</text>
  <text x="220" y="201" fill="rgba(255,255,255,0.2)" font-family="monospace" font-size="8">Today at 9:12 AM</text>
  <text x="154" y="218" fill="rgba(255,255,255,0.75)" font-family="monospace" font-size="9">DROP ALERT: Yeezy Boost 350 V2 "Zebra"</text>
  <text x="154" y="231" fill="rgba(0,212,255,0.8)" font-family="monospace" font-size="9">Size 11 · $220 · adidas.com · DROPPING IN 2 MIN</text>

  <!-- New badge -->
  <rect x="596" y="188" width="36" height="16" rx="8" fill="rgba(0,212,255,0.2)" stroke="rgba(0,212,255,0.5)" stroke-width="1"/>
  <text x="614" y="200" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="8" font-weight="700">NEW</text>

  <!-- Stats panel (right) -->
  <rect x="668" y="60" width="88" height="240" rx="12" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="712" y="88" text-anchor="middle" fill="rgba(255,255,255,0.25)" font-family="monospace" font-size="8" font-weight="600">STATS</text>
  <line x1="676" y1="96" x2="748" y2="96" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="712" y="124" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="20" font-weight="700">$300K</text>
  <text x="712" y="140" text-anchor="middle" fill="rgba(0,212,255,0.4)" font-family="monospace" font-size="7">total sales</text>
  <line x1="676" y1="152" x2="748" y2="152" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="712" y="176" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="20" font-weight="700">1K+</text>
  <text x="712" y="192" text-anchor="middle" fill="rgba(167,139,250,0.4)" font-family="monospace" font-size="7">pairs sold</text>
  <line x1="676" y1="204" x2="748" y2="204" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="712" cy="228" r="10" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="712" y="232" text-anchor="middle" fill="#22c55e" font-size="11">✓</text>
  <text x="712" y="248" text-anchor="middle" fill="rgba(34,197,94,0.4)" font-family="monospace" font-size="7">live</text>

  <text x="400" y="332" text-anchor="middle" fill="rgba(0,212,255,0.3)" font-family="monospace" font-size="10" letter-spacing="2">DISCORD API · WEB SCRAPING · REAL-TIME ALERTS</text>
</svg>
