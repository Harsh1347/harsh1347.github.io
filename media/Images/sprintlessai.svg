  <rect x="578" y="76" width="164" height="14" fill="rgba(0,212,255,0.1)"/>
  <text x="596" y="83" fill="rgba(0,212,255,0.7)" font-family="monospace" font-size="8" font-weight="600">US-001 · As a user...</text>
  <rect x="592" y="100" width="120" height="5" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="592" y="112" width="100" height="5" rx="2" fill="rgba(255,255,255,0.07)"/>
  <rect x="592" y="124" width="90"  height="5" rx="2" fill="rgba(255,255,255,0.07)"/>
