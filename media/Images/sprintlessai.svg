  <rect x="688" y="118" width="42" height="14" rx="7" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
  <text x="709" y="129" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="8">Done</text>

  <!-- Card 2 -->
  <rect x="578" y="152" width="164" height="72" rx="8" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.3)" stroke-width="1.5"/>
  <rect x="578" y="152" width="164" height="22" rx="8" fill="rgba(0,212,255,0.1)"/>
  <rect x="578" y="160" width="164" height="14" fill="rgba(0,212,255,0.1)"/>
  <text x="596" y="167" fill="rgba(0,212,255,0.7)" font-family="monospace" font-size="8" font-weight="600">US-002 · As an admin...</text>
  <rect x="592" y="184" width="110" height="5" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="592" y="196" width="95"  height="5" rx="2" fill="rgba(255,255,255,0.07)"/>
  <rect x="592" y="208" width="85"  height="5" rx="2" fill="rgba(255,255,255,0.07)"/>
  <rect x="688" y="202" width="42" height="14" rx="7" fill="rgba(234,179,8,0.15)" stroke="rgba(234,179,8,0.4)" stroke-width="1"/>
  <text x="709" y="213" text-anchor="middle" fill="#eab308" font-family="monospace" font-size="8">TODO</text>

  <!-- Card 3 -->
  <rect x="578" y="236" width="164" height="54" rx="8" fill="rgba(124,58,237,0.06)" stroke="rgba(124,58,237,0.3)" stroke-width="1.5"/>
  <text x="596" y="256" fill="rgba(167,139,250,0.7)" font-family="monospace" font-size="8" font-weight="600">US-003 · As a manager...</text>
  <rect x="592" y="264" width="105" height="5" rx="2" fill="rgba(255,255,255,0.07)"/>
  <rect x="592" y="276" width="80"  height="5" rx="2" fill="rgba(255,255,255,0.05)"/>

  <text x="400" y="340" text-anchor="middle" fill="rgba(0,212,255,0.3)" font-family="monospace" font-size="10" letter-spacing="2">RAG · CODEBASE CONTEXT · JIRA / GITHUB UPLOAD</text>
</svg>
