  <text x="400" y="190" text-anchor="middle" fill="rgba(167,139,250,0.6)" font-family="monospace" font-size="9">RAG + Code Context</text>
  <text x="400" y="204" text-anchor="middle" fill="rgba(167,139,250,0.4)" font-family="monospace" font-size="8">Agile Story Generator</text>
  <!-- Decorative dots -->
  <circle cx="330" cy="125" r="3" fill="rgba(124,58,237,0.5)"/>
  <circle cx="470" cy="125" r="3" fill="rgba(124,58,237,0.5)"/>
  <circle cx="330" cy="215" r="3" fill="rgba(124,58,237,0.5)"/>
  <circle cx="470" cy="215" r="3" fill="rgba(124,58,237,0.5)"/>

